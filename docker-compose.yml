services:
  backend:
    image: firmware-checker-backend:deploy
    env_file:
      - ./backend/.env
    environment:
      FWAUDIT_UPLOAD_DIR: /app/data/uploads
      FWAUDIT_REPORT_DIR: /app/data/reports
      PYTHON_EXECUTABLE: python
    volumes:
      - ./data:/app/data
    expose:
      - "9001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "0.0.0.0:9000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
