
<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字节跳动版本包审计引擎 | 固件合规审计系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              },
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 8s linear infinite',
            }
          }
        }
      }
    </script>
    <style>
        :root {
          --bg-main: #f8fafc;
          --glass-bg: rgba(255, 255, 255, 0.6);
          --glass-border: rgba(0, 0, 0, 0.05);
          --text-main: #0f172a;
          --text-muted: #64748b;
        }
        
        html.dark {
          --bg-main: #020617;
          --glass-bg: rgba(255, 255, 255, 0.03);
          --glass-border: rgba(255, 255, 255, 0.08);
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
        }

        body { 
          font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
          background-color: var(--bg-main);
          color: var(--text-main);
          transition: background-color 0.5s ease;
          overflow-x: hidden;
        }

        .glass {
          background: var(--glass-bg);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid var(--glass-border);
          transition: background 0.3s ease, border 0.3s ease;
        }

        .ai-glow {
          box-shadow: 0 0 50px -10px rgba(59, 130, 246, 0.2);
        }

        .mesh-gradient {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: -1;
          pointer-events: none;
          opacity: 0.6;
        }
        
        html.light .mesh-gradient {
          background: 
            radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0, transparent 50%),
            radial-gradient(at 100% 0%, rgba(147, 197, 253, 0.1) 0, transparent 50%),
            radial-gradient(at 50% 100%, rgba(241, 245, 249, 1) 0, transparent 80%);
        }

        html.dark .mesh-gradient {
          background: 
            radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0, transparent 50%),
            radial-gradient(at 100% 0%, rgba(76, 29, 149, 0.3) 0, transparent 50%),
            radial-gradient(at 50% 100%, rgba(15, 23, 42, 1) 0, transparent 80%);
        }

        @keyframes scan {
          0% { transform: translateY(-100%); opacity: 0; }
          50% { opacity: 1; }
          100% { transform: translateY(100%); opacity: 0; }
        }

        .scan-line {
          position: absolute;
          width: 100%;
          height: 2px;
          background: linear-gradient(to right, transparent, #3b82f6, transparent);
          animation: scan 3s linear infinite;
        }

        .upload-zone-confirmed {
          animation: upload-zone-confirmed .75s cubic-bezier(.2, .8, .25, 1);
        }

        .upload-icon-confirmed {
          animation: upload-icon-confirmed .7s cubic-bezier(.2, .9, .25, 1);
        }

        .upload-check {
          position: absolute;
          right: -10px;
          bottom: -10px;
          display: grid;
          place-items: center;
          width: 34px;
          height: 34px;
          color: white;
          background: #10b981;
          border: 4px solid var(--bg-main);
          border-radius: 50%;
          box-shadow: 0 8px 18px rgba(16, 185, 129, .35);
          animation: upload-check-in .45s .08s both cubic-bezier(.2, .9, .25, 1);
        }

        .upload-spark {
          position: absolute;
          color: #fde68a;
          pointer-events: none;
          animation: upload-spark-fly .8s ease-out both;
        }

        .upload-spark-one {
          top: -13px;
          right: -14px;
        }

        .upload-spark-two {
          top: 16px;
          left: -18px;
          animation-delay: .1s;
        }

        .audit-core-pulse {
          animation: audit-core-pulse 2.3s ease-in-out infinite;
        }

        .audit-orbit {
          position: absolute;
          inset: 20px;
          pointer-events: none;
          animation: audit-orbit-spin 5s linear infinite;
        }

        .audit-orbit-two {
          inset: 37px;
          animation-direction: reverse;
          animation-duration: 7s;
        }

        .audit-orbit span {
          position: absolute;
          top: -9px;
          left: 50%;
          display: grid;
          place-items: center;
          width: 19px;
          height: 19px;
          color: #2563eb;
          background: white;
          border: 1px solid rgba(37, 99, 235, .2);
          border-radius: 50%;
          box-shadow: 0 4px 12px rgba(37, 99, 235, .18);
          transform: translateX(-50%);
        }

        .audit-orbit-two span {
          color: #f59e0b;
          border-color: rgba(245, 158, 11, .25);
        }

        .analysis-beat-dot {
          width: 7px;
          height: 7px;
          background: #93c5fd;
          border-radius: 50%;
          animation: analysis-beat 1.35s ease-in-out infinite;
        }

        .analysis-beat-dot-2 { animation-delay: .15s; }
        .analysis-beat-dot-3 { animation-delay: .3s; }

        .audit-complete-spotlight {
          position: relative;
          display: flex;
          align-items: center;
          gap: 14px;
          min-height: 78px;
          margin: 0 auto 28px;
          padding: 15px 20px;
          overflow: hidden;
          color: #064e3b;
          background: linear-gradient(110deg, rgba(236, 253, 245, .96), rgba(239, 246, 255, .96));
          border: 1px solid rgba(16, 185, 129, .22);
          border-radius: 24px;
          box-shadow: 0 18px 42px rgba(15, 118, 110, .1);
          animation: audit-complete-in .7s cubic-bezier(.2, .9, .25, 1) both;
        }

        .dark .audit-complete-spotlight {
          color: #d1fae5;
          background: linear-gradient(110deg, rgba(6, 78, 59, .42), rgba(30, 58, 138, .42));
          border-color: rgba(52, 211, 153, .24);
        }

        .audit-complete-icon {
          position: relative;
          z-index: 1;
          display: grid;
          place-items: center;
          width: 44px;
          height: 44px;
          flex: 0 0 auto;
          color: white;
          background: #10b981;
          border-radius: 15px;
          box-shadow: 0 8px 18px rgba(16, 185, 129, .26);
          animation: audit-complete-icon .65s .12s both cubic-bezier(.2, .9, .25, 1);
        }

        .audit-complete-kicker {
          position: relative;
          z-index: 1;
          margin: 0 0 3px;
          font-size: 10px;
          font-weight: 900;
          letter-spacing: .18em;
          text-transform: uppercase;
          color: #10b981;
        }

        .dark .audit-complete-kicker { color: #6ee7b7; }

        .audit-complete-copy {
          position: relative;
          z-index: 1;
          margin: 0;
          font-size: 15px;
          font-weight: 800;
        }

        .audit-complete-score {
          position: relative;
          z-index: 1;
          margin-left: auto;
          color: #047857;
          font-size: 28px;
          font-weight: 900;
          letter-spacing: -.04em;
        }

        .dark .audit-complete-score { color: #a7f3d0; }

        .audit-complete-score span {
          margin-left: 3px;
          font-size: 12px;
          letter-spacing: 0;
        }

        .audit-complete-confetti {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        .audit-complete-confetti span {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 7px;
          height: 3px;
          border-radius: 2px;
          background: #f59e0b;
          opacity: 0;
          animation: audit-confetti 1.1s .18s ease-out both;
        }

        .audit-complete-confetti span:nth-child(2n) { background: #60a5fa; }
        .audit-complete-confetti span:nth-child(3n) { background: #34d399; }
        .audit-complete-confetti span:nth-child(1) { --x: -180px; --y: -28px; --r: -30deg; }
        .audit-complete-confetti span:nth-child(2) { --x: -120px; --y: 26px; --r: 20deg; }
        .audit-complete-confetti span:nth-child(3) { --x: -72px; --y: -34px; --r: 70deg; }
        .audit-complete-confetti span:nth-child(4) { --x: -20px; --y: 30px; --r: -50deg; }
        .audit-complete-confetti span:nth-child(5) { --x: 38px; --y: -30px; --r: 20deg; }
        .audit-complete-confetti span:nth-child(6) { --x: 90px; --y: 24px; --r: 70deg; }
        .audit-complete-confetti span:nth-child(7) { --x: 142px; --y: -32px; --r: -25deg; }
        .audit-complete-confetti span:nth-child(8) { --x: 190px; --y: 16px; --r: 55deg; }
        .audit-complete-confetti span:nth-child(9) { --x: -154px; --y: 2px; --r: 10deg; }
        .audit-complete-confetti span:nth-child(10) { --x: -44px; --y: -18px; --r: -70deg; }
        .audit-complete-confetti span:nth-child(11) { --x: 64px; --y: 12px; --r: 45deg; }
        .audit-complete-confetti span:nth-child(12) { --x: 154px; --y: -5px; --r: -10deg; }

        @media (max-width: 640px) {
          .audit-complete-spotlight {
            align-items: flex-start;
            padding: 14px;
            gap: 10px;
          }

          .audit-complete-copy {
            font-size: 13px;
          }

          .audit-complete-score {
            font-size: 22px;
          }
        }

        @keyframes upload-zone-confirmed {
          0% { transform: scale(1); }
          36% { transform: scale(1.012); border-color: rgba(16, 185, 129, .65); }
          100% { transform: scale(1); }
        }

        @keyframes upload-icon-confirmed {
          0% { transform: scale(1) rotate(0); }
          45% { transform: scale(1.08) rotate(-4deg); }
          100% { transform: scale(1) rotate(0); }
        }

        @keyframes upload-check-in {
          0% { opacity: 0; transform: scale(0) rotate(-25deg); }
          70% { transform: scale(1.15) rotate(6deg); }
          100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes upload-spark-fly {
          0% { opacity: 0; transform: scale(.4) translate(0, 8px); }
          35% { opacity: 1; }
          100% { opacity: 0; transform: scale(1) translate(0, -13px); }
        }

        @keyframes audit-core-pulse {
          0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(37, 99, 235, .12); }
          50% { transform: scale(1.035); box-shadow: 0 24px 48px rgba(37, 99, 235, .22); }
        }

        @keyframes audit-orbit-spin {
          from { transform: rotate(0); }
          to { transform: rotate(360deg); }
        }

        @keyframes analysis-beat {
          0%, 100% { opacity: .3; transform: translateY(0) scale(.8); }
          50% { opacity: 1; transform: translateY(-4px) scale(1.1); }
        }

        @keyframes audit-complete-in {
          0% { opacity: 0; transform: translateY(-12px) scale(.98); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes audit-complete-icon {
          0% { transform: scale(.5) rotate(-12deg); }
          70% { transform: scale(1.12) rotate(3deg); }
          100% { transform: scale(1) rotate(0); }
        }

        @keyframes audit-confetti {
          0% { opacity: 0; transform: translate(-50%, -50%) rotate(0) scale(.4); }
          15% { opacity: 1; }
          100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)) scale(1); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(0, 0, 0, 0.1);
          border-radius: 10px;
        }
        html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.1);
        }

        @keyframes login-cat-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }

        @keyframes login-cat-breathe {
          0%, 100% { transform: scaleY(1) translateY(0); }
          50% { transform: scaleY(1.015) translateY(-1px); }
        }

        @keyframes login-cat-lucky-wave {
          0%, 100% { transform: rotate(5deg) translate(0, 0); }
          28% { transform: rotate(-7deg) translate(-2px, -4px); }
          55% { transform: rotate(5deg) translate(1px, 0); }
          78% { transform: rotate(-3deg) translate(-1px, -2px); }
        }

        @keyframes login-cat-bell {
          0%, 100% { transform: rotate(-4deg); }
          50% { transform: rotate(5deg); }
        }

        @keyframes login-guide-pulse {
          0%, 100% { opacity: 0.7; transform: translate(0, 0); }
          50% { opacity: 1; transform: translate(2px, -2px); }
        }

        .login-cat {
          overflow: visible;
          animation: login-cat-float 2.8s ease-in-out infinite;
        }

        .login-cat-body {
          transform-box: fill-box;
          transform-origin: center bottom;
          animation: login-cat-breathe 3.2s ease-in-out infinite;
        }

        .login-cat-head {
          transform-box: fill-box;
          transform-origin: center;
          transition: transform 180ms ease-out;
        }

        .login-cat-paw {
          transform-box: fill-box;
          transform-origin: 82% 86%;
          animation: login-cat-lucky-wave 1.9s ease-in-out infinite;
        }

        .login-cat-bell {
          transform-box: fill-box;
          transform-origin: center top;
          animation: login-cat-bell 1.9s ease-in-out infinite;
        }

        .login-guide-arrow {
          animation: login-guide-pulse 1.1s ease-in-out infinite;
        }

        .muyu-stage {
          position: relative;
          width: min(18rem, 78vw);
          height: 15.5rem;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .muyu-aura {
          position: absolute;
          width: 11rem;
          height: 8rem;
          border-radius: 50%;
          background: radial-gradient(ellipse, rgba(242, 172, 82, .26), transparent 68%);
          filter: blur(8px);
          transform: translateY(1.5rem);
        }

        .muyu-wooden-fish {
          position: relative;
          z-index: 2;
          width: 15rem;
          height: 13.5rem;
          overflow: visible;
          transition: transform .2s ease;
        }

        .muyu-tap-button {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 16rem;
          height: 14rem;
          padding: 0;
          border: 0;
          border-radius: 50%;
          background: transparent;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }

        .muyu-tap-button:hover .muyu-wooden-fish {
          transform: translateY(-3px) scale(1.025);
        }

        .muyu-tap-button:focus-visible {
          outline: 3px solid rgba(125, 211, 252, .9);
          outline-offset: 5px;
        }

        .muyu-body {
          transform-box: fill-box;
          transform-origin: center;
          transition: transform .16s ease;
        }

        .muyu-mallet {
          transform-box: view-box;
          transform-origin: 204px 94px;
          transition: transform .16s ease;
        }

        .muyu-tap-hint,
        .muyu-count {
          position: absolute;
          z-index: 3;
          pointer-events: none;
          font-size: 10px;
          font-weight: 800;
          letter-spacing: .08em;
          white-space: nowrap;
        }

        .muyu-tap-hint {
          bottom: 1px;
          padding: 5px 10px;
          color: rgba(255, 237, 190, .92);
          background: rgba(92, 42, 24, .72);
          border: 1px solid rgba(255, 208, 132, .32);
          border-radius: 999px;
        }

        .muyu-count {
          top: 5px;
          right: 4px;
          padding: 5px 9px;
          color: #6e3b13;
          background: linear-gradient(135deg, #fff2ae, #efb947);
          border: 1px solid rgba(255, 244, 180, .8);
          border-radius: 999px;
          box-shadow: 0 4px 14px rgba(245, 183, 62, .18);
        }

        .muyu-toast {
          position: absolute;
          z-index: 4;
          top: .3rem;
          left: 50%;
          color: #ffe8a7;
          font-size: 18px;
          font-weight: 900;
          letter-spacing: .03em;
          text-shadow: 0 2px 12px rgba(249, 180, 61, .32);
          pointer-events: none;
          white-space: nowrap;
          transform: translateX(-50%);
          animation: muyu-toast-float 1.7s ease-out both;
        }

        .muyu-ripple {
          position: absolute;
          z-index: 1;
          width: 7rem;
          height: 5rem;
          border: 2px solid rgba(255, 211, 123, 0);
          border-radius: 50%;
          transform: translateY(1.5rem) scale(.65);
          opacity: 0;
        }

        @keyframes muyu-knock {
          0%, 100% { transform: rotate(0deg); }
          22% { transform: rotate(-5deg) translate(-2px, 1px); }
          48% { transform: rotate(4deg) translate(1px, -1px); }
          72% { transform: rotate(-2deg); }
        }

        @keyframes muyu-mallet-knock {
          0%, 100% { transform: rotate(0deg); }
          35% { transform: rotate(-24deg); }
          62% { transform: rotate(8deg); }
        }

        @keyframes muyu-knock-alt {
          0%, 100% { transform: rotate(0deg); }
          22% { transform: rotate(5deg) translate(2px, 1px); }
          48% { transform: rotate(-4deg) translate(-1px, -1px); }
          72% { transform: rotate(2deg); }
        }

        @keyframes muyu-mallet-knock-alt {
          0%, 100% { transform: rotate(0deg); }
          35% { transform: rotate(-20deg); }
          62% { transform: rotate(6deg); }
        }

        @keyframes muyu-ripple-out {
          0% { opacity: .65; transform: translateY(1.5rem) scale(.7); border-color: rgba(255, 211, 123, .55); }
          100% { opacity: 0; transform: translateY(1.5rem) scale(1.5); border-color: rgba(255, 211, 123, 0); }
        }

        @keyframes muyu-toast-float {
          0% { opacity: 0; transform: translate(-50%, 12px) scale(.85); }
          18% { opacity: 1; transform: translate(-50%, 0) scale(1); }
          68% { opacity: 1; transform: translate(-50%, -8px) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -24px) scale(.96); }
        }

        .muyu-is-knocking .muyu-body {
          animation: muyu-knock .38s cubic-bezier(.2, .8, .35, 1);
        }

        .muyu-is-knocking .muyu-mallet {
          animation: muyu-mallet-knock .38s cubic-bezier(.2, .8, .35, 1);
        }

        .muyu-is-knocking.muyu-beat-1 .muyu-body {
          animation-name: muyu-knock-alt;
        }

        .muyu-is-knocking.muyu-beat-1 .muyu-mallet {
          animation-name: muyu-mallet-knock-alt;
        }

        .muyu-is-knocking .muyu-ripple-one {
          animation: muyu-ripple-out .8s ease-out both;
        }

        .muyu-is-knocking .muyu-ripple-two {
          animation: muyu-ripple-out .8s .12s ease-out both;
        }

        @media (prefers-reduced-motion: reduce) {
          .login-cat,
          .login-guide-arrow {
            animation: none;
          }

          .login-cat-body,
          .login-cat-paw,
          .login-cat-bell {
            animation: none;
          }

          .login-cat-head {
            transition: none;
          }

          .muyu-wooden-fish,
          .muyu-body,
          .muyu-mallet {
            transition: none;
            animation: none;
          }

          .muyu-toast,
          .muyu-ripple-one,
          .muyu-ripple-two {
            animation: none;
          }

          .upload-zone-confirmed,
          .upload-icon-confirmed,
          .upload-check,
          .upload-spark,
          .audit-core-pulse,
          .audit-orbit,
          .analysis-beat-dot,
          .audit-complete-spotlight,
          .audit-complete-icon,
          .audit-complete-confetti span {
            animation: none;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div class="mesh-gradient"></div>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
